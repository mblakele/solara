# Schema documented at https://render.com/docs/yaml-spec
services:
  - type: web
    name: solara
    env: python
    buildCommand: uv sync
    # Load management assumes exactly ONE process: keep the default single
    # gunicorn worker (no -w/--workers) and numInstances: 1. A second
    # process would run duplicate decision loops against the same physical
    # devices (guarded by the .load-manager.lock flock; see wsgi.py).
    # Do NOT add --preload: background threads would be lost at fork.
    startCommand: gunicorn wsgi:app --worker-class=gthread --threads=4 --timeout=31
    plan: free
    numInstances: 1
    envVars:
      - key: VUE_USERNAME
        generateValue: false
        sync: false
      - key: VUE_PASSWORD
        generateValue: false
        sync: false
      - key: TIMEZONE
        value: America/Los_Angeles
      - key: LOAD_MANAGE_ENABLED
        value: "False"
      - key: LOAD_MANAGE_INTERVAL_SECS
        value: "30"
      - key: LOAD_TARGET_WH
        value: "-50"
